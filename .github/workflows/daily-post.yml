name: MARC-Jarvis — Publicação Diária

on:
  schedule:
    # Todos os dias às 9:00 UTC (10:00 PT/Brasil)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar e publicar artigo
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/generate-post.py 2>&1 || echo "SCRIPT EXIT CODE: $?"
